<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creating Forms</title>
</head>


<body>
    <h1>Forms Demo</h1>
    <form action="/tacos">
        <p>
            <label for="Username">Enter the Username:</label>
            <input id="Username" type="text" placeholder="Username">
        </p>
        <p>
            <label for="password">Enter the password:</label>
            <input type="password" placeholder="password">
        </p>
        <p>
            <input type="color">
        </p>
        <p>
            <label for="number">Enter the number:</label>
            <input type="number" placeholder="Enter the number">
        </p>
        <button>Submit</button>
    </form>

    <h2>More Inputs! </h2>
    <form action="/birds">
        <input type="checkbox" name="Agree to t&c" id="Agree">
        <label for="Agree">I agree to everything </label>
        <p>
            <label for="xs">XS:</label>
            <input type="radio" name="size" id="xs" value="xs">
            <label for="s">S:</label>
            <input type="radio" name="size" id="s" value="s">
            <label for="m">M:</label>
            <input type="radio" name="size" id="m" value="m">
        </p>
        <p>
            <label for="meal">Please choose the meal: </label>
            <select name="meal" id="meal">
                <option value="Fish">Fish:</option>
                <option value="Mutton">Mutton:</option>
                <option value="Chicken">Chicken:</option>
            </select>
        </p>
        <p>
            <label for="cheese">Amount of cheese</label>
            <input type="range" id="cheese" min="1" max="10" name="cheese_level">
        </p>
        <p>
            <label for="requests">Any Special Requests ?</label>
            <textarea name="" id="requests"></textarea>
        </p>
        <button>Submit</button>
    </form>

</body>

</html>
